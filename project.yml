name: EosSmartWorking
options:
  bundleIdPrefix: com.eos
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  EosSmartWorking:
    type: application
    platform: iOS
    sources:
      - path: ios/EosSmartWorking
    settings:
      base:
        INFOPLIST_FILE: ios/EosSmartWorking/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.eos.smartworking
        PRODUCT_NAME: "EOS Smart Working"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ios/EosSmartWorking/Info.plist
      properties:
        CFBundleName: "EOS Smart Working"
        CFBundleDisplayName: "EOS Smart Working"
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
